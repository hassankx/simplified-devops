<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>Simplified DevOps</title>
<style>
  :root{--bg:#f2f4f8;--ink:#151e2c;--muted:#586577;--line:#d6dce6;--accent:#2f4fd0;--surface:#fff}
